# CI pipeline: lint, build and test each package in parallel, run only when
# relevant files change.

name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
    types: [opened, reopened, synchronize]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      types: ${{ steps.filter.outputs.types }}
      db: ${{ steps.filter.outputs.db }}
      api: ${{ steps.filter.outputs.api }}
      client: ${{ steps.filter.outputs.client }}
      bot: ${{ steps.filter.outputs.bot }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # On manual dispatch there is no event "before" commit: diff against HEAD~1
          base: ${{ github.event_name == 'workflow_dispatch' && 'HEAD~1' || '' }}
          filters: |
            types:
              - 'packages/types/**'
            db:
              - 'packages/db/**'
            api:
              - 'packages/api/**'
            client:
              - 'packages/client/**'
            bot:
              - 'packages/bot/**'
            shared:
              - 'pnpm-lock.yaml'
              - 'Makefile'
              - 'package.json'
              - '.github/workflows/pipeline.yml'
              - '.github/actions/**'

  ## DB ##
  lint-db:
    needs: changes
    if: needs.changes.outputs.db == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          filter: '@soker90/finper-db'
      - name: Lint
        run: make lint-db

  test-db:
    needs: changes
    if: needs.changes.outputs.db == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          filter: '@soker90/finper-db'
      - name: Test
        run: make test-db
      - name: Codecov
        uses: codecov/codecov-action@v6
        with:
          flags: db
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  ## API ##
  lint-api:
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.db == 'true' || needs.changes.outputs.types == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          filter: '@soker90/finper-api'
      - name: Lint
        run: make lint-api

  build-api:
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.db == 'true' || needs.changes.outputs.types == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          filter: '@soker90/finper-api'
      - name: Build
        run: make build-api

  test-api:
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.db == 'true' || needs.changes.outputs.types == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          filter: '@soker90/finper-api'
      - name: Test (shard ${{ matrix.shard }}/2)
        run: make test-api SHARD=--shard=${{ matrix.shard }}/2
      - name: Codecov
        uses: codecov/codecov-action@v6
        with:
          flags: api
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  type-check-api:
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.db == 'true' || needs.changes.outputs.types == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          filter: '@soker90/finper-api'
      - name: Type check
        run: make type-check-api

  ## Frontend ##
  lint-client:
    needs: changes
    if: needs.changes.outputs.client == 'true' || needs.changes.outputs.types == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          filter: '@soker90/finper-client'
      - name: Lint
        run: make lint-client

  build-client:
    needs: changes
    if: needs.changes.outputs.client == 'true' || needs.changes.outputs.types == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          filter: '@soker90/finper-client'
      - name: Build
        run: make build-client

  test-client:
    needs: changes
    if: needs.changes.outputs.client == 'true' || needs.changes.outputs.types == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          filter: '@soker90/finper-client'
      - name: Test (shard ${{ matrix.shard }}/2)
        run: make test-client SHARD=--shard=${{ matrix.shard }}/2
      - name: Codecov
        uses: codecov/codecov-action@v6
        with:
          flags: client
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  ## Bot ##
  lint-bot:
    needs: changes
    if: needs.changes.outputs.bot == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          filter: '@soker90/finper-bot'
      - name: Lint
        run: make lint-bot

  type-check-bot:
    needs: changes
    if: needs.changes.outputs.bot == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          filter: '@soker90/finper-bot'
      - name: Type check
        run: make type-check-bot

  deploy-bot:
    needs: [changes, lint-bot, type-check-bot]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push' && needs.changes.outputs.bot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          filter: '@soker90/finper-bot'
      - name: Deploy
        run: make deploy-bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
