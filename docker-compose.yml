services:
  api:
    image: soker90/finper-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Ruta del fichero SQLite DENTRO del contenedor.
      # El volumen finperdb se monta en /home/node/app/data; el fichero queda
      # en la raíz de ese volumen. Para cambiar el nombre, sobreescribe
      # DATABASE_FILE en el .env (ej: DATABASE_FILE=/home/node/app/data/otro.db).
      DATABASE_FILE: ${DATABASE_FILE:-/home/node/app/data/finper.db}
      JWT_SECRET: ${JWT_SECRET}
      SALT_ROUNDS: ${SALT_ROUNDS}
      TICKET_BOT_URL: ${TICKET_BOT_URL}
      TICKET_BOT_API_KEY: ${TICKET_BOT_API_KEY}
    # Da margen al graceful shutdown (checkpoint del WAL de SQLite, ver
    # server.ts SHUTDOWN_TIMEOUT_MS) antes de que Docker mande SIGKILL.
    stop_grace_period: 15s
    volumes:
      # Ruta del host definida en DATA_PATH (.env) — carpeta donde vive tu
      # SQLite actual.
      - ${DATA_PATH}:/home/node/app/data
    # Descomenta solo si necesitas pegarle a la API directamente (depuración,
    # otra integración). Para el túnel de Cloudflare no hace falta: el
    # cliente ya la expone vía proxy en /api/.
    # ports:
    #   - 3008:3008
    networks:
      - finper-network

  client:
    image: soker90/finper-client:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - 3009:3009
    networks:
      - finper-network

networks:
  finper-network:
    name: finper-network
    driver: bridge
